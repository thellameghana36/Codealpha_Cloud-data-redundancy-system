<!DOCTYPE html>
<html>
<head><title>Data Redundancy System</title></head>
<body style="font-family:Arial; text-align:center; padding:20px;">
<h2>Cloud - Data Redundancy Removal</h2>
<form method="POST" enctype="multipart/form-data">
<input type="file" name="file" required>
<button type="submit">Upload & Check</button>
</form>
<h3>{{ message }}</h3>
<hr>
<h3>Cloud Storage Database</h3>
<table border="1" style="margin:auto;">
<tr><th>ID</th><th>File Name</th><th>Status</th></tr>
{% for f in files %}
<tr><td>{{ f[0] }}</td><td>{{ f[1] }}</td><td>{{ f[3] }}</td></tr>
{% endfor %}
</table>
</body>
</html>
